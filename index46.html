<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - SECURE INTERNATIONAL BANK</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; background: #05070a; font-family: 'Orbitron', sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .terminal-frame { background: rgba(10, 15, 24, 0.75); border: 1px solid var(--glass-border); padding: 25px; border-radius: 24px; width: 360px; max-height: 90vh; overflow-y: auto; }
        .hidden { display: none !important; }
        .brand-header { font-size: 18px; font-weight: 800; text-align: center; color: var(--electric-blue); margin-bottom: 20px; }
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--shocking-pink); border-radius: 14px; padding: 14px; width: 100%; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 10px; font-family: 'Orbitron', sans-serif; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; padding: 15px; border-radius: 12px; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        #qrcode { background: #fff; padding: 10px; border-radius: 12px; margin: 20px auto; display: block; width: 200px !important; height: 200px !important; }
        .viewfinder-wrapper { width: 100%; min-height: 260px; background: #000; border: 2px dashed var(--shocking-pink); margin: 10px 0; }
        #rewardModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 999; }
    </style>
</head>
<body>

<div id="rewardModal" class="hidden">
    <div style="background: #1a0b1f; padding: 30px; border-radius: 20px; border: 1px solid var(--electric-blue);">
        <h1>REWARD ISSUED!</h1>
        <button class="action-panel-btn" onclick="document.getElementById('rewardModal').classList.add('hidden')">CONFIRM</button>
    </div>
</div>

<div class="terminal-frame">
    <div id="authView">
        <div class="brand-header">SECURE ACCESS</div>
        <div class="pin-grid">
            <button class="glass-btn" onclick="input(1)">1</button><button class="glass-btn" onclick="input(2)">2</button><button class="glass-btn" onclick="input(3)">3</button>
            <button class="glass-btn" onclick="input(4)">4</button><button class="glass-btn" onclick="input(5)">5</button><button class="glass-btn" onclick="input(6)">6</button>
            <button class="glass-btn" onclick="input(7)">7</button><button class="glass-btn" onclick="input(8)">8</button><button class="glass-btn" onclick="input(9)">9</button>
            <button class="glass-btn" onclick="clearPin()">C</button><button class="glass-btn" onclick="input(0)">0</button><button class="glass-btn" onclick="submit()">E</button>
        </div>
        <button id="changePinBtn" class="action-panel-btn" onclick="setInitialPin()">CHANGE PIN / REWARD</button>
    </div>

    <div id="dashboardView" class="hidden">
        <div class="brand-header">TIFFY BANK</div>
        <div id="totalBalanceDisplay" style="text-align:center; font-size:32px; margin: 20px 0;">$0.00</div>
        <button class="action-panel-btn" onclick="harvest()">RECOLLECT HARVEST</button>
        <button class="action-panel-btn" onclick="openSend()">SEND ASSET</button>
        <button class="action-panel-btn" onclick="openReceive()">RECEIVE ASSET</button>
    </div>

    <div id="pairingView" class="hidden">
        <canvas id="qrcode"></canvas>
        <button class="action-panel-btn" onclick="shareQR()">SHARE QR IMAGE</button>
        <button class="action-panel-btn" onclick="exit()">BACK</button>
    </div>

    <div id="scannerView" class="hidden">
        <div class="viewfinder-wrapper" id="camera-viewfinder"></div>
        <input type="file" id="f" style="display:none" onchange="fileScan(event)">
        <button class="action-panel-btn" onclick="document.getElementById('f').click()">UPLOAD QR</button>
        <button class="action-panel-btn" onclick="stopScanner()">CANCEL</button>
    </div>
</div>

<script>
    let p = "", s = null;
    function input(n) { if(p.length < 6) p += n; }
    function clearPin() { p = ""; }
    function submit() {
        if(p === (localStorage.getItem("Tiffy_User_PIN") || "1234")) {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            load();
        } else { alert("Denied"); clearPin(); }
    }

    function setInitialPin() {
        if(prompt("Old PIN:") === "1234") {
            let n = prompt("New PIN:");
            if(n) {
                localStorage.setItem("Tiffy_User_PIN", n);
                let b = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
                localStorage.setItem("TUSD_Nitro_Storage", (b + 500).toFixed(2));
                document.getElementById('rewardModal').classList.remove('hidden');
                load();
            }
        }
    }

    function load() {
        let h = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.includes('tetrus') || k.includes('tiffy')) h += parseFloat(localStorage.getItem(k)) || 0;
        }
        document.getElementById('totalBalanceDisplay').innerText = "$" + (parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0) + h).toFixed(2);
    }

    function harvest() {
        let h = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.includes('tetrus') || k.includes('tiffy')) {
                h += parseFloat(localStorage.getItem(k)) || 0;
                localStorage.setItem(k, "0.00");
            }
        }
        let b = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (b + h).toFixed(2));
        load();
    }

    function openSend() {
        let a = prompt("Amount:");
        if(!a) return;
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('pairingView').classList.remove('hidden');
        QRCode.toCanvas(document.getElementById('qrcode'), "TIFFY_TX:" + btoa(JSON.stringify({amt: a})), {width:200});
    }

    async function shareQR() {
        const canvas = document.getElementById('qrcode');
        canvas.toBlob(async (blob) => {
            const file = new File([blob], "qr.png", {type: "image/png"});
            await navigator.share({files: [file], text: "My Tiffy QR"});
        });
    }

    function openReceive() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('scannerView').classList.remove('hidden');
        s = new Html5Qrcode("camera-viewfinder");
        s.start({facingMode: "environment"}, {fps: 10, qrbox: 250}, (d) => { stopScanner(); alert(d); });
    }

    function stopScanner() { if(s) s.stop().then(exit); else exit(); }
    function exit() { document.getElementById('pairingView').classList.add('hidden'); document.getElementById('scannerView').classList.add('hidden'); document.getElementById('dashboardView').classList.remove('hidden'); load(); }
</script>
</body>
</html>
