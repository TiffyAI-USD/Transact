<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFFY AI - Premium Fluid Ledger Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="console.log('Running in local offline hardware mode')"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
  :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
  body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #ffffff; }
  .terminal-frame { background: rgba(10, 15, 24, 0.65); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); padding: 35px 25px; border-radius: 28px; width: 350px; height: 620px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: space-between; z-index: 10; transition: all 0.2s; }
  .hidden { display: none !important; }
  .brand-header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-header p { color: #8b9bb4; font-size: 10px; margin: 0 0 15px 0; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  .balance-card { background: rgba(255, 255, 255, 0.01); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; text-align: left; margin-bottom: 12px; }
  .main-crypto-val { font-size: 24px; font-weight: 800; margin: 6px 0 2px 0; }
  .token-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .token-tile { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 12px; }
  .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 0; color: #ffffff; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; margin-top: 10px; width: 100%; }
  #qrcode { background: #ffffff; padding: 12px; border-radius: 16px; margin: 15px 0; display: inline-block; width: 180px; height: 180px; }
  .fallback-upload-container { border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; margin: 12px 0; }
</style>
</head>
<body>

<div class="terminal-frame">
  <div id="dashboardView">
    <div class="brand-header"><h1>TIFFY AI</h1><p>Fluid Ledger Terminal</p></div>
    <div class="balance-card">
        <p style="font-size:10px; color:#8b9bb4;">Total Liquid Value</p>
        <div class="main-crypto-val" id="totalBalanceDisplay">0.00</div>
    </div>
    <div class="token-breakdown">
        <div class="token-tile" style="border-color: var(--shocking-pink);">
            <h4 style="font-size:9px; color:var(--shocking-pink);">Harvested Utility</h4>
            <p id="tiffyAmount" style="font-size:12px;">0.00</p>
        </div>
        <div class="token-tile" style="border-color: var(--electric-blue);">
            <h4 style="font-size:9px; color:var(--electric-blue);">Conversion (TUSD)</h4>
            <p id="nitroAmount" style="font-size:12px;">0.00</p>
        </div>
    </div>
    <button class="action-panel-btn" style="border-color:var(--electric-blue);" onclick="harvestAndRecollectStore()">COLLECT EARNINGS</button>
    <div class="action-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button class="action-panel-btn" onclick="openTapToPayMode()">Show Code</button>
        <button class="action-panel-btn" onclick="activateEmbeddedScanner()">Scan QR</button>
    </div>
  </div>

  <div id="pairingView" class="hidden" style="text-align:center;">
    <div class="brand-header"><h1>TRANSACTION</h1></div>
    <div id="qrcode"></div>
    <button class="action-panel-btn" onclick="exitMode()">Close Request</button>
  </div>

  <div id="scannerView" class="hidden" style="text-align:center;">
    <div id="camera-viewfinder" style="height:200px;"></div>
    <div id="file-fallback-ui" class="fallback-upload-container" onclick="document.getElementById('qr-file-input').click()">
        <p>DROP QR IMAGE HERE</p>
        <input type="file" id="qr-file-input" accept="image/*" style="display: none;" onchange="processUploadedQrImage(this.files[0])">
    </div>
    <button class="action-panel-btn" onclick="exitMode()">Cancel</button>
  </div>
</div>

<script>
  window.onload = () => {
    if (!localStorage.getItem("TUSD_Nitro_Storage")) localStorage.setItem("TUSD_Nitro_Storage", "1450.00");
    loadBalances();
    setupGlobalDragAndDrop();
  };

  function loadBalances() {
    let gameEarnings = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if ((k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) && k !== "TUSD_Nitro_Storage") {
        gameEarnings += parseFloat(localStorage.getItem(k)) || 0;
      }
    }
    const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage")) || 0;
    document.getElementById('tiffyAmount').innerText = gameEarnings.toFixed(2);
    document.getElementById('nitroAmount').innerText = (gameEarnings * 20).toFixed(2);
    document.getElementById('totalBalanceDisplay').innerText = "$" + nitro.toFixed(2);
  }

  function harvestAndRecollectStore() {
    let earnings = parseFloat(document.getElementById('tiffyAmount').innerText) || 0;
    let nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage")) || 0;
    if (earnings <= 0) return;
    
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if ((k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) && k !== "TUSD_Nitro_Storage") {
        localStorage.removeItem(k);
      }
    }
    localStorage.setItem("TUSD_Nitro_Storage", (nitro + (earnings * 20)).toString());
    loadBalances();
    alert("Earnings collected and converted!");
  }

  function setupGlobalDragAndDrop() {
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) processUploadedQrImage(e.dataTransfer.files[0]);
    });
    document.body.addEventListener('dragover', (e) => e.preventDefault());
  }

  function openTapToPayMode() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('pairingView').classList.remove('hidden');
    const qr = document.getElementById('qrcode');
    qr.innerHTML = "";
    QRCode.toCanvas(qr, "TIFFY_TX:" + btoa(JSON.stringify({amount: 10})), {width:180});
  }

  function activateEmbeddedScanner() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('scannerView').classList.remove('hidden');
  }

  function processUploadedQrImage(file) {
    const reader = new Html5Qrcode("camera-viewfinder");
    reader.scanFile(file, true).then(data => {
        alert("Scanned: " + data);
        exitMode();
    });
  }

  function exitMode() {
    document.getElementById('pairingView').classList.add('hidden');
    document.getElementById('scannerView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');
    loadBalances();
  }
</script>
</body>
</html>
