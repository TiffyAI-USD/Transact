<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - Ultimate Gateway Terminal</title>
    
    <meta property="og:title" content="TIFFY AI - SECURE INTERNATIONAL BANK">
    <meta property="og:description" content="Claim your $500 reward: Use Default PIN Code 1234, change the default pin, make it yours and get $500 in your own sovereign bank to buy and sell anything!">
    <meta property="og:url" content="https://tiffyai-usd.github.io/Transact/index46.html">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #ffffff; }

        .terminal-frame { background: rgba(10, 15, 24, 0.65); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); padding: 35px 25px; border-radius: 28px; width: 350px; height: 560px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }

        .brand-header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-header p { color: #8b9bb4; font-size: 10px; margin: 0 0 15px 0; letter-spacing: 2px; text-transform: uppercase; text-align: center; }

        .pin-display { display: flex; justify-content: center; gap: 12px; margin: 15px 0 25px 0; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); transition: all 0.2s ease; }
        .dot.active { background: var(--electric-blue); box-shadow: 0 0 12px var(--electric-blue); transform: scale(1.1); }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #ffffff; font-size: 20px; border-radius: 14px; padding: 14px 0; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 0; color: #ffffff; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; font-family: 'Orbitron', sans-serif; width: 100%; margin-top: 10px; }
        .action-panel-btn.pink { border-color: var(--shocking-pink); }
        
        #qrcode { background: white; padding: 10px; border-radius: 12px; margin: 15px auto; display: block; }
        .viewfinder-wrapper { width: 100%; height: 260px; background: #000; margin: 12px 0; border: 2px dashed var(--shocking-pink); }

        #rewardModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .reward-card { background: linear-gradient(135deg, #0a0f18, #1a0b1f); border: 2px solid var(--electric-blue); padding: 40px; border-radius: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="rewardModal" class="hidden">
    <div class="reward-card">
        <h1 style="color:var(--electric-blue);">REWARD ISSUED!</h1>
        <p style="font-size: 24px; color: #fff;">$500.00</p>
        <p style="font-size: 12px; color: var(--shocking-pink);">CREDITED TO YOUR SOVEREIGN BANK</p>
        <button class="action-panel-btn" onclick="document.getElementById('rewardModal').classList.add('hidden')">CONFIRM</button>
    </div>
</div>

<div class="terminal-frame">
  <div id="authView">
    <div class="brand-header"><h1>TIFFY AI</h1><p>Secure Terminal Access</p></div>
    <div class="pin-display"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pin-grid">
      <button class="glass-btn" onclick="inputNum(1)">1</button><button class="glass-btn" onclick="inputNum(2)">2</button><button class="glass-btn" onclick="inputNum(3)">3</button>
      <button class="glass-btn" onclick="inputNum(4)">4</button><button class="glass-btn" onclick="inputNum(5)">5</button><button class="glass-btn" onclick="inputNum(6)">6</button>
      <button class="glass-btn" onclick="inputNum(7)">7</button><button class="glass-btn" onclick="inputNum(8)">8</button><button class="glass-btn" onclick="inputNum(9)">9</button>
      <button class="glass-btn" style="font-size:12px;" onclick="clearPin()">CLR</button><button class="glass-btn" onclick="inputNum(0)">0</button><button class="glass-btn" style="font-size:12px;" onclick="submitPin()">ENT</button>
    </div>
    <button class="action-panel-btn pink" id="changePinBtn" onclick="setInitialPin()">CHANGE DEFAULT PIN (RECEIVE $500)</button>
  </div>

  <div id="dashboardView" class="hidden">
    <div class="brand-header"><h1>TIFFY BANK</h1><p>Active Fluid Index</p></div>
    <div style="text-align: center; margin: 20px 0;">
        <div id="totalBalanceDisplay" style="font-size:32px; font-weight:800;">$0.00</div>
    </div>
    <button class="action-panel-btn pink" onclick="harvestAndRecollect()">RECOLLECT HARVEST</button>
    <button class="action-panel-btn" onclick="openTapToPayMode()">SEND ASSET</button>
    <button class="action-panel-btn" onclick="activateScanner()">RECEIVE ASSET</button>
  </div>

  <div id="pairingView" class="hidden">
    <div class="brand-header"><h1>TRANSACTION</h1><p>Show to Receiver</p></div>
    <canvas id="qrcode"></canvas>
    <button class="action-panel-btn pink" onclick="shareTransaction()">SHARE QR & REWARD 🔗</button>
    <button class="action-panel-btn" onclick="exitMode()">BACK TO DASHBOARD</button>
  </div>

  <div id="scannerView" class="hidden">
    <div class="viewfinder-wrapper" id="camera-viewfinder"></div>
    <button class="action-panel-btn" onclick="stopScanner()">CANCEL SCAN</button>
  </div>
</div>

<script>
    let currentPin = "";
    let activeScanner = null;

    // PIN & REWARD LOGIC
    function inputNum(n) { if(currentPin.length < 6) { currentPin += n; updateDots(); } }
    function clearPin() { currentPin = ""; updateDots(); }
    function updateDots() { document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i < currentPin.length)); }

    function submitPin() {
        const savedPin = localStorage.getItem("Tiffy_User_PIN") || "1234";
        if(currentPin === savedPin) {
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadBalances();
        } else { alert("Access Denied"); clearPin(); }
    }

    function setInitialPin() {
        const current = prompt("Verify Old PIN (Default 1234):");
        if(current === "1234") {
            const newPin = prompt("Enter New Unique PIN (Min 4 digits):");
            if(newPin && newPin.length >= 4) {
                localStorage.setItem("Tiffy_User_PIN", newPin);
                localStorage.setItem("TUSD_Nitro_Storage", "500.00");
                document.getElementById('rewardModal').classList.remove('hidden');
                loadBalances();
            }
        } else { alert("Verification Failed."); }
    }

    // CORE LOGIC
    function loadBalances() {
        let rawGame = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) rawGame += parseFloat(localStorage.getItem(k)) || 0;
        }
        const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        document.getElementById('totalBalanceDisplay').innerText = "$" + (nitro + rawGame).toFixed(2);
    }

    function harvestAndRecollect() {
        let total = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) {
                total += parseFloat(localStorage.getItem(k)) || 0;
                localStorage.setItem(k, "0.00"); // FIXED: Reset to 0, data persists
            }
        }
        let currentNitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (currentNitro + total).toFixed(2));
        alert("Harvest of $" + total.toFixed(2) + " collected.");
        loadBalances();
    }

    // QR & UI FLOW
    function openTapToPayMode() {
        let amt = prompt("Amount:");
        if(!amt || isNaN(amt)) return;
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('pairingView').classList.remove('hidden');
        QRCode.toCanvas(document.getElementById('qrcode'), "TIFFY_TX:" + btoa(JSON.stringify({amount: amt})), {width: 200});
    }

    function activateScanner() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('scannerView').classList.remove('hidden');
        activeScanner = new Html5Qrcode("camera-viewfinder");
        activeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (data) => {
            stopScanner();
            alert("Scanned: " + data);
        });
    }

    function stopScanner() { if(activeScanner) activeScanner.stop().then(exitMode).catch(exitMode); else exitMode(); }
    function exitMode() { document.getElementById('pairingView').classList.add('hidden'); document.getElementById('scannerView').classList.add('hidden'); document.getElementById('dashboardView').classList.remove('hidden'); loadBalances(); }
    
    async function shareTransaction() {
        const shareText = "Claim your $500 reward: https://tiffyai-usd.github.io/Transact/index46.html";
        if (navigator.share) { await navigator.share({text: shareText}); } else { alert(shareText); }
    }
</script>
</body>
</html>
