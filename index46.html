<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - SECURE INTERNATIONAL BANK</title>
    <meta property="og:title" content="TIFFY AI - SECURE INTERNATIONAL BANK">
    <meta property="og:description" content="Claim your $500 reward: Use Default PIN Code 1234, change the default pin, make it yours and get $500 in your own sovereign bank!">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%); font-family: 'Orbitron', sans-serif; color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .terminal-frame { background: rgba(10, 15, 24, 0.65); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); padding: 35px 25px; border-radius: 28px; width: 350px; height: 560px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .brand-header { font-size: 24px; font-weight: 800; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .pin-display { display: flex; justify-content: center; gap: 12px; margin: 15px 0 25px 0; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); }
        .dot.active { background: var(--electric-blue); box-shadow: 0 0 12px var(--electric-blue); }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #ffffff; font-size: 20px; border-radius: 14px; padding: 14px 0; cursor: pointer; }
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--shocking-pink); border-radius: 14px; padding: 14px 0; color: #ffffff; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; margin-top: 10px; width: 100%; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; margin: 15px auto; display: inline-block; }
    </style>
</head>
<body>

<div class="terminal-frame">
  <div id="authView">
    <div class="brand-header">TIFFY AI</div>
    <div class="pin-display"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pin-grid">
      <button class="glass-btn" onclick="inputNum(1)">1</button><button class="glass-btn" onclick="inputNum(2)">2</button><button class="glass-btn" onclick="inputNum(3)">3</button>
      <button class="glass-btn" onclick="inputNum(4)">4</button><button class="glass-btn" onclick="inputNum(5)">5</button><button class="glass-btn" onclick="inputNum(6)">6</button>
      <button class="glass-btn" onclick="inputNum(7)">7</button><button class="glass-btn" onclick="inputNum(8)">8</button><button class="glass-btn" onclick="inputNum(9)">9</button>
      <button class="glass-btn" style="font-size:12px;" onclick="clearPin()">CLR</button><button class="glass-btn" onclick="inputNum(0)">0</button><button class="glass-btn" style="font-size:12px;" onclick="submitPin()">ENT</button>
    </div>
    <button class="action-panel-btn" onclick="setInitialPin()">CHANGE PIN / REWARD</button>
  </div>

  <div id="dashboardView" class="hidden">
    <div class="brand-header">BANKING</div>
    <div style="text-align: center; margin: 20px 0;">
        <div id="totalBalanceDisplay" style="font-size:32px; font-weight:800;">$0.00</div>
    </div>
    <button class="action-panel-btn" onclick="harvestAndRecollect()">RECOLLECT HARVEST</button>
    <button class="action-panel-btn" onclick="openTapToPayMode()">SEND ASSET</button>
  </div>

  <div id="pairingView" class="hidden">
    <div class="brand-header">QR TRANSACTION</div>
    <div id="qrcode"></div>
    <button class="action-panel-btn" onclick="exitMode()">CLOSE</button>
  </div>
</div>

<script>
  let currentPin = "";
  function inputNum(n) { if(currentPin.length < 6) { currentPin += n; updateDots(); } }
  function clearPin() { currentPin = ""; updateDots(); }
  function updateDots() { document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i < currentPin.length)); }

  function submitPin() {
    if(currentPin === (localStorage.getItem("Tiffy_User_PIN") || "1234")) {
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        loadBalances();
    } else { alert("Access Denied"); clearPin(); }
  }

  function setInitialPin() {
    if(prompt("Verify Old PIN (Default 1234):") === "1234") {
        const newPin = prompt("Enter New PIN:");
        if(newPin) {
            localStorage.setItem("Tiffy_User_PIN", newPin);
            localStorage.setItem("TUSD_Nitro_Storage", "500.00");
            alert("Reward Issued & PIN Updated.");
            loadBalances();
        }
    }
  }

  function loadBalances() {
    let rawGame = 0;
    for(let i=0; i<localStorage.length; i++) {
        let k = localStorage.key(i);
        if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) rawGame += parseFloat(localStorage.getItem(k)) || 0;
    }
    const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
    document.getElementById('totalBalanceDisplay').innerText = "$" + (nitro + rawGame).toFixed(2);
  }

  function harvestAndRecollect() {
    let total = 0;
    for(let i=0; i<localStorage.length; i++) {
        let k = localStorage.key(i);
        if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) {
            total += parseFloat(localStorage.getItem(k)) || 0;
            localStorage.setItem(k, "0.00");
        }
    }
    localStorage.setItem("TUSD_Nitro_Storage", (parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0) + total).toFixed(2));
    alert("Collected: $" + total.toFixed(2));
    loadBalances();
  }

  function openTapToPayMode() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('pairingView').classList.remove('hidden');
    const qr = qrcode(0, 'M');
    qr.addData("TIFFY_TX:" + btoa(JSON.stringify({val: document.getElementById('totalBalanceDisplay').innerText})));
    qr.make();
    document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
  }

  function exitMode() {
    document.getElementById('pairingView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');
  }
</script>
</body>
</html>
