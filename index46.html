<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFFY AI - Ultimate Gateway Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
  body { margin: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%); font-family: 'Orbitron', sans-serif; display: flex; justify-content: center; align-items: center; color: #ffffff; overflow: hidden; }
  .terminal-frame { background: rgba(10, 15, 24, 0.65); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); padding: 35px 25px; border-radius: 28px; width: 350px; height: 560px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
  .hidden { display: none !important; }
  .brand-header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-header p { color: #8b9bb4; font-size: 10px; margin: 0 0 15px 0; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  .pin-display { display: flex; justify-content: center; gap: 12px; margin: 15px 0 25px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); transition: all 0.2s ease; }
  .dot.active { background: var(--electric-blue); box-shadow: 0 0 12px var(--electric-blue); }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .glass-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #ffffff; font-size: 20px; border-radius: 14px; padding: 14px 0; cursor: pointer; }
  .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 0; color: #ffffff; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px; }
  #qrcode { background: white; padding: 10px; border-radius: 12px; margin: 15px auto; display: block; }
  #camera-viewfinder { width: 100%; height: 260px; background: #000; border: 2px dashed var(--shocking-pink); margin: 12px 0; }
</style>
</head>
<body>

<div class="terminal-frame">
  <div id="authView">
    <div class="brand-header"><h1>TIFFY AI</h1><p>Secure Terminal Access</p></div>
    <div class="pin-display"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pin-grid">
      <button class="glass-btn" onclick="inputNum(1)">1</button><button class="glass-btn" onclick="inputNum(2)">2</button><button class="glass-btn" onclick="inputNum(3)">3</button>
      <button class="glass-btn" onclick="inputNum(4)">4</button><button class="glass-btn" onclick="inputNum(5)">5</button><button class="glass-btn" onclick="inputNum(6)">6</button>
      <button class="glass-btn" onclick="inputNum(7)">7</button><button class="glass-btn" onclick="inputNum(8)">8</button><button class="glass-btn" onclick="inputNum(9)">9</button>
      <button class="glass-btn" style="font-size:12px" onclick="clearPin()">CLR</button><button class="glass-btn" onclick="inputNum(0)">0</button><button class="glass-btn" style="font-size:12px" onclick="submitPin()">ENT</button>
    </div>
    <button class="action-panel-btn" onclick="setInitialPin()">CHANGE PIN / REWARD</button>
  </div>

  <div id="dashboardView" class="hidden">
    <div class="brand-header"><h1>TIFFY BANK</h1><p>Active Fluid Index</p></div>
    <div style="text-align: center; margin: 20px 0;">
        <div id="totalBalanceDisplay" style="font-size:32px; font-weight:800;">$0.00</div>
    </div>
    <button class="action-panel-btn" onclick="harvestAndRecollect()">RECOLLECT HARVEST</button>
    <button class="action-panel-btn" onclick="openTapToPayMode()">SEND ASSET</button>
    <button class="action-panel-btn" onclick="activateScanner()">SCAN QR CODE</button>
  </div>

  <div id="pairingView" class="hidden">
    <div class="brand-header"><h1>TRANSACTION</h1></div>
    <div id="qrcode"></div>
    <button class="action-panel-btn" onclick="exitMode()">CLOSE</button>
  </div>

  <div id="scannerView" class="hidden">
    <div id="camera-viewfinder"></div>
    <button class="action-panel-btn" onclick="stopScanner()">CANCEL</button>
  </div>
</div>

<script>
  let currentPin = "";
  function inputNum(n) { if(currentPin.length < 6) { currentPin += n; updateDots(); } }
  function clearPin() { currentPin = ""; updateDots(); }
  function updateDots() { document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i < currentPin.length)); }

  function submitPin() {
    if(currentPin === (localStorage.getItem("Tiffy_User_PIN") || "1234")) {
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        loadBalances();
    } else { alert("Access Denied"); clearPin(); }
  }

  function setInitialPin() {
    if(prompt("Verify Old PIN (Default 1234):") === "1234") {
        const newPin = prompt("Enter New Unique PIN:");
        if(newPin && newPin.length >= 4) {
            localStorage.setItem("Tiffy_User_PIN", newPin);
            let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
            localStorage.setItem("TUSD_Nitro_Storage", (bal + 500).toFixed(2));
            alert("Reward Issued.");
            loadBalances();
        }
    }
  }

  function loadBalances() {
    let raw = 0;
    for(let i=0; i<localStorage.length; i++) {
        let k = localStorage.key(i);
        if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) raw += parseFloat(localStorage.getItem(k)) || 0;
    }
    document.getElementById('totalBalanceDisplay').innerText = "$" + (parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0) + raw).toFixed(2);
  }

  function harvestAndRecollect() {
    let total = 0;
    for(let i=0; i<localStorage.length; i++) {
        let k = localStorage.key(i);
        if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) {
            total += parseFloat(localStorage.getItem(k)) || 0;
            localStorage.setItem(k, "0.00");
        }
    }
    let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
    localStorage.setItem("TUSD_Nitro_Storage", (bal + total).toFixed(2));
    alert("Collected: $" + total.toFixed(2));
    loadBalances();
  }

  function openTapToPayMode() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('pairingView').classList.remove('hidden');
    const qr = qrcode(0, 'M');
    qr.addData("TIFFY_TX:" + btoa(JSON.stringify({val: document.getElementById('totalBalanceDisplay').innerText})));
    qr.make();
    document.getElementById('qrcode').innerHTML = qr.createImgTag(5);
  }

  function activateScanner() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('scannerView').classList.remove('hidden');
    const s = new Html5Qrcode("camera-viewfinder");
    s.start({facingMode: "environment"}, {fps: 10, qrbox: 250}, (d) => { s.stop(); alert("Scanned: " + d); exitMode(); });
  }

  function stopScanner() { location.reload(); }
  function exitMode() { document.getElementById('pairingView').classList.add('hidden'); document.getElementById('scannerView').classList.add('hidden'); document.getElementById('dashboardView').classList.remove('hidden'); }
</script>
</body>
</html>
