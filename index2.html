<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFFY AI - Ultimate Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<!-- Live Web3 Injection Layer -->
<script src="https://cdn.jsdelivr.net/npm/web3@1.9.0/dist/web3.min.js"></script>
<style>
  :root {
    --electric-blue: #00f0ff;
    --shocking-pink: #ff007f;
    --neon-glow-blue: rgba(0, 240, 255, 0.4);
    --neon-glow-pink: rgba(255, 0, 127, 0.4);
    --glass-bg: rgba(255, 255, 255, 0.02);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%);
    font-family: 'Orbitron', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #ffffff;
  }

  /* Main Terminal Chassis */
  .terminal-frame {
    background: rgba(10, 15, 24, 0.6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border);
    padding: 40px 30px;
    border-radius: 28px;
    width: 360px;
    height: 520px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hidden { display: none !important; }

  .brand-header h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 5px 0;
    letter-spacing: 2px;
    text-align: center;
    background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px var(--neon-glow-pink));
  }

  .brand-header p {
    color: #8b9bb4;
    font-size: 11px;
    margin: 0 0 20px 0;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  /* ==================== SCREEN 1: SECURE PIN PAD ==================== */
  .pin-display { display: flex; justify-content: center; gap: 15px; margin: 20px 0 35px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); transition: all 0.2s ease; }
  .dot.active { background: var(--electric-blue); box-shadow: 0 0 12px var(--electric-blue), 0 0 25px var(--electric-blue); transform: scale(1.2); }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
  
  .glass-btn {
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    color: #ffffff;
    font-size: 22px;
    border-radius: 16px;
    padding: 16px 0;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'Orbitron', sans-serif;
  }

  .glass-btn:active {
    border-color: var(--electric-blue);
    box-shadow: 0 0 15px var(--neon-glow-blue);
    color: var(--electric-blue);
    transform: scale(0.95);
  }

  .glass-btn.action-btn { font-size: 11px; text-transform: uppercase; color: #ffb6db; }
  .glass-btn.action-btn:active { border-color: var(--shocking-pink); box-shadow: 0 0 15px var(--neon-glow-pink); color: var(--shocking-pink); }

  /* ==================== SCREEN 2: FUNCTIONAL DASHBOARD ==================== */
  .dashboard-view { display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
  .balance-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); border-radius: 20px; padding: 22px; text-align: left; margin-bottom: 15px; }
  .balance-card .meta-label { font-size: 11px; text-transform: uppercase; color: #8b9bb4; margin: 0; }
  .balance-card .main-crypto-val { font-size: 30px; font-weight: 800; margin: 8px 0 4px 0; color: #ffffff; }
  
  .token-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
  .token-tile { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 14px; padding: 14px; }
  .token-tile h4 { margin: 0 0 6px 0; font-size: 10px; text-transform: uppercase; }
  .token-tile.tiffy h4 { color: var(--shocking-pink); }
  .token-tile.nitro h4 { color: var(--electric-blue); }
  .token-tile p { margin: 0; font-size: 15px; font-weight: 700; }

  .action-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px 0; color: #ffffff; font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; font-family: 'Orbitron', sans-serif; transition: all 0.2s ease; }
  .action-panel-btn.pay-btn { border-color: var(--shocking-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.15); }
  .action-panel-btn.pay-btn:active { background: var(--shocking-pink); box-shadow: 0 0 25px var(--shocking-pink); transform: scale(0.96); }
  .action-panel-btn.receive-btn { border-color: var(--electric-blue); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
  .action-panel-btn.receive-btn:active { background: var(--electric-blue); box-shadow: 0 0 25px var(--electric-blue); color: #05070a; transform: scale(0.96); }

  .status-indicator { text-align: center; font-size: 11px; color: #5f7594; margin-top: 15px; }
  .status-indicator span { display: inline-block; width: 6px; height: 6px; background: #00ff66; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #00ff66; }
  .back-portal-link { color: var(--electric-blue); text-decoration: none; font-size: 12px; display: block; text-align: center; margin-top: 12px;}
</style>
</head>
<body>

<div class="terminal-frame">
  
  <!-- SCREEN 1: SECURE VAULT ACCESS -->
  <div id="authView">
    <div class="brand-header">
      <h1>TIFFY AI</h1>
      <p>Secure Vault Access</p>
    </div>

    <div class="pin-display">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="pin-grid">
      <button class="glass-btn" onclick="inputNum(1)">1</button>
      <button class="glass-btn" onclick="inputNum(2)">2</button>
      <button class="glass-btn" onclick="inputNum(3)">3</button>
      <button class="glass-btn" onclick="inputNum(4)">4</button>
      <button class="glass-btn" onclick="inputNum(5)">5</button>
      <button class="glass-btn" onclick="inputNum(6)">6</button>
      <button class="glass-btn" onclick="inputNum(7)">7</button>
      <button class="glass-btn" onclick="inputNum(8)">8</button>
      <button class="glass-btn" onclick="inputNum(9)">9</button>
      <button class="glass-btn action-btn" onclick="clearPin()">Clear</button>
      <button class="glass-btn" onclick="inputNum(0)">0</button>
      <button class="glass-btn action-btn" onclick="submitPin()">Enter</button>
    </div>
  </div>

  <!-- SCREEN 2: ACTIVE REKINDLED DASHBOARD -->
  <div id="dashboardView" class="dashboard-view hidden">
    <div>
      <div class="brand-header">
        <h1>TIFFY AI</h1>
        <p>Liquid Network Active</p>
      </div>

      <div class="balance-card">
        <p class="meta-label">Total Liquid Value</p>
        <div class="main-crypto-val" id="totalBalanceDisplay">$1,450.00</div>
        <p id="walletAddressDisplay" style="font-size:10px; color:#8b9bb4; margin:4px 0 0 0; word-break:break-all;">Wallet: Syncing...</p>
      </div>

      <div class="token-breakdown">
        <div class="token-tile tiffy">
          <h4>Harvested Utility</h4>
          <p id="tiffyAmount">0.00</p>
        </div>
        <div class="token-tile nitro">
          <h4>TUSD Nitro</h4>
          <p id="nitroAmount">1450.00</p>
        </div>
      </div>
    </div>

    <div>
      <div class="action-strip">
        <button class="action-panel-btn pay-btn" onclick="executeLocalPayment()">Tap to Pay</button>
        <button class="action-panel-btn receive-btn" onclick="harvestAndRecollectStore()">Recollect</button>
      </div>
      <div class="status-indicator">
        <span></span><span id="statusMessage" style="display:inline; box-shadow:none; background:none; color:inherit;">System Connected</span>
      </div>
      <a href="https://tiffyai-usd.github.io/Dream-Menu" class="back-portal-link">← Portal Home</a>
    </div>
  </div>

</div>

<script>
  // Smart Contract Definitions from Your Production Setup
  const CONTRACT_ADDRESS = "0xe488253dd6b4d31431142f1b7601c96f24fb7dd5";
  const BSC_CHAIN_ID = "0x38";

  let currentPin = "";
  const maxPinLength = 6;
  const dots = document.querySelectorAll('.dot');
  let web3, accounts;

  function inputNum(num) {
    if (currentPin.length < maxPinLength) {
      currentPin += num;
      updatePinDisplay();
      if (navigator.vibrate) navigator.vibrate(40);
    }
  }

  function clearPin() {
    currentPin = "";
    updatePinDisplay();
    if (navigator.vibrate) navigator.vibrate(20);
  }

  function updatePinDisplay() {
    dots.forEach((dot, index) => {
      if (index < currentPin.length) dot.classList.add('active');
      else dot.classList.remove('active');
    });
  }

  async function submitPin() {
    if (currentPin.length === maxPinLength) {
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      
      // Reveal the Dashboard Frame smoothly
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      
      // Initialize live wallet injections & automatically run initial storage check
      await initLiveWeb3Connection();
    } else {
      alert("Please enter your 6-digit secure PIN.");
    }
  }

  async function initLiveWeb3Connection() {
    if (typeof window.ethereum !== 'undefined') {
      try {
        web3 = new Web3(window.ethereum);
        await window.ethereum.request({ method: 'eth_requestAccounts' });
        accounts = await web3.eth.getAccounts();
        
        if(accounts && accounts.length > 0) {
          const addr = accounts[0];
          document.getElementById('walletAddressDisplay').innerText = `Wallet: ${addr.slice(0,6)}...${addr.slice(-4)}`;
        }
      } catch (err) {
        document.getElementById('statusMessage').innerText = "Wallet Provider Rejected";
      }
    } else {
      document.getElementById('walletAddressDisplay').innerText = `Wallet: No Extension Detected`;
    }
    
    // Auto-scan local device data immediately upon access
    await initialDashboardLoad();
  }

  // Initial scanning layout designed to find existing gaming rewards
  async function initialDashboardLoad() {
    let discoveredGameEarnings = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const keyName = localStorage.key(i);
        const lowerKey = keyName.toLowerCase();
        if (lowerKey.includes('tetrus') || lowerKey.includes('claim') || lowerKey.includes('tiffy')) {
          const rawVal = localStorage.getItem(keyName);
          const parsed = parseFloat(rawVal);
          if (!isNaN(parsed)) {
            discoveredGameEarnings += parsed;
          }
        }
      }
    } catch (e) {
      console.error(e);
    }
    document.getElementById('tiffyAmount').innerText = discoveredGameEarnings.toLocaleString('en-US', { minimumFractionDigits: 2 });
  }

  // The Master Recollection & Clearing Mechanism
  async function harvestAndRecollectStore() {
    const statusText = document.getElementById('statusMessage');
    const tiffyDisplay = document.getElementById('tiffyAmount');
    const nitroDisplay = document.getElementById('nitroAmount');
    const totalDisplay = document.getElementById('totalBalanceDisplay');
    
    let currentTiffy = parseFloat(tiffyDisplay.innerText.replace(/,/g, ''));
    let currentNitro = parseFloat(nitroDisplay.innerText.replace(/,/g, ''));

    if (currentTiffy <= 0) {
      statusText.innerText = "No pending game rewards found.";
      if (navigator.vibrate) navigator.vibrate(100);
      return;
    }

    statusText.innerText = "Clearing storage & Rekindling balances... ⏳";
    if (navigator.vibrate) navigator.vibrate([40, 40]);

    // Fast-acting physical animation delay
    await new Promise(resolve => setTimeout(resolve, 800));

    // Wiping the temporary phone memory keys so they cannot be double-counted or re-claimed
    try {
      const keysToRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const keyName = localStorage.key(i);
        const lowerKey = keyName.toLowerCase();
        if (lowerKey.includes('tetrus') || lowerKey.includes('claim') || lowerKey.includes('tiffy')) {
          keysToRemove.push(keyName);
        }
      }
      keysToRemove.forEach(key => localStorage.removeItem(key));
    } catch (e) {
      console.error(e);
    }

    // Move the numbers directly into the main spendable utility index pool
    const newNitroBalance = currentNitro + currentTiffy;
    const newTiffyBalance = 0.00;

    tiffyDisplay.innerText = newTiffyBalance.toLocaleString('en-US', { minimumFractionDigits: 2 });
    nitroDisplay.innerText = newNitroBalance.toLocaleString('en-US', { minimumFractionDigits: 2 });
    totalDisplay.innerText = `$${newNitroBalance.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

    statusText.innerText = "Balances Rekindled Successfully! 🚀";
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  }

  // Instant 0-ms Local Payment Trigger
  function executeLocalPayment() {
    const statusText = document.getElementById('statusMessage');
    const nitroDisplay = document.getElementById('nitroAmount');
    const totalDisplay = document.getElementById('totalBalanceDisplay');

    let currentNitro = parseFloat(nitroDisplay.innerText.replace(/,/g, ''));
    const paymentAmount = 10.00;

    if (currentNitro >= paymentAmount) {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      currentNitro -= paymentAmount;

      nitroDisplay.innerText = currentNitro.toLocaleString('en-US', { minimumFractionDigits: 2 });
      totalDisplay.innerText = `$${currentNitro.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
      
      statusText.innerText = `Paid $${paymentAmount.toFixed(2)} instantly offline!`;
    } else {
      statusText.innerText = "Liquidity threshold reached.";
      alert("Please collect game earnings or check your local vault status.");
    }
  }
</script>

</body>
</html>
