<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIFFY AI - PRODUCTION MASTER SECURE NODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%); font-family: 'Orbitron', sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .terminal-frame { background: rgba(10, 15, 24, 0.75); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 25px 20px; border-radius: 24px; width: 360px; height: 580px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .hidden { display: none !important; }
        .brand-header h1 { font-size: 24px; font-weight: 800; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-card { background: rgba(255, 255, 255, 0.01); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; margin: 10px 0; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        #qrcode { background: #fff; padding: 12px; border-radius: 16px; margin: 20px auto; display: block; width: 185px !important; height: 185px !important; }
        .viewfinder-wrapper { width: 100%; height: 260px; background: #000; border-radius: 16px; margin: 12px 0; border: 2px dashed var(--glass-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #drop-zone { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 100; pointer-events: none; }
    </style>
</head>
<body id="drop-target">

<div id="drop-zone"></div>
<div class="terminal-frame">
    <div id="dashboardView">
        <div class="brand-header"><h1>TIFFY AI</h1><p>Master Secure Node</p></div>
        <div class="balance-card">
            <p style="font-size:10px; color:#8b9bb4;">TOTAL LIQUID VALUE</p>
            <div id="totalBalanceDisplay" style="font-size:26px; font-weight:800;">$0.00</div>
            <p id="pendingOutboundLabel" style="font-size:9px; color:var(--shocking-pink); display:none;">PENDING: <span id="pendingOutboundValue">0.00</span></p>
        </div>
        <div class="action-grid">
            <button class="action-panel-btn" onclick="openTapToPayMode()">SEND ASSET</button>
            <button class="action-panel-btn" onclick="harvestAndRecollectStore()">RECOLLECT</button>
            <button id="voidBtn" class="action-panel-btn hidden" style="border-color:var(--shocking-pink); grid-column: span 2;" onclick="cancelPendingTransfer()">VOID OFFER</button>
            <button class="action-panel-btn" style="grid-column: span 2;" onclick="activateEmbeddedScanner()">SCAN & RECEIVE</button>
        </div>
    </div>

    <div id="pairingView" class="hidden">
        <div class="brand-header"><h1>SECURE SIGNATURE</h1></div>
        <canvas id="qrcode"></canvas>
        <button class="action-panel-btn" style="width:100%" onclick="exitMode()">CANCEL</button>
    </div>

    <div id="scannerView" class="hidden">
        <div class="brand-header"><h1>SCAN MATRIX</h1></div>
        <div class="viewfinder-wrapper" id="camera-viewfinder"></div>
        <button class="action-panel-btn" style="width:100%" onclick="stopScannerAndExit()">CANCEL SCAN</button>
    </div>
</div>

<script>
    const GATEWAY_SECURITY_PIN = "1234";
    let activeScanner = null;

    // --- DRAG AND DROP HANDLING (PC) ---
    const dropTarget = document.getElementById('drop-target');
    dropTarget.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropTarget.addEventListener('drop', (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    if (code) processReceivedTx(code.data);
                    else alert("Invalid QR Image");
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    function processReceivedTx(data) {
        if(data.startsWith("TIFFY_TX:")) {
            const tx = JSON.parse(atob(data.split(":")[1]));
            if(confirm("Accept transaction of $" + tx.amount + "?")) {
                let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
                localStorage.setItem("TUSD_Nitro_Storage", (bal + parseFloat(tx.amount)).toFixed(2));
                loadBalances();
            }
        }
    }

    // --- CORE LEDGER LOGIC ---
    function loadBalances() {
        let earnings = 0;
        for(let i=0; i<localStorage.length; i++) {
            const k = localStorage.key(i);
            if((k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) && k !== "TUSD_Nitro_Storage" && k !== "Tiffy_Pending_Outbound") {
                earnings += parseFloat(localStorage.getItem(k)) || 0;
            }
        }
        const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        const pend = parseFloat(localStorage.getItem("Tiffy_Pending_Outbound") || 0);
        document.getElementById('totalBalanceDisplay').innerText = "$" + nitro.toFixed(2);
        
        const pendingUI = document.getElementById('pendingOutboundLabel');
        const voidBtn = document.getElementById('voidBtn');
        if(pend > 0) {
            pendingUI.style.display = "block";
            document.getElementById('pendingOutboundValue').innerText = pend.toFixed(2);
            voidBtn.classList.remove('hidden');
        } else {
            pendingUI.style.display = "none";
            voidBtn.classList.remove('hidden') ? voidBtn.classList.add('hidden') : null;
        }
    }

    function openTapToPayMode() {
        if(localStorage.getItem("Tiffy_Pending_Outbound")) { alert("Void existing offer first."); return; }
        let pin = prompt("Enter Ledger PIN:");
        if(pin !== GATEWAY_SECURITY_PIN) return;
        let amt = prompt("Amount:");
        if(!amt || isNaN(amt)) return;
        
        localStorage.setItem("Tiffy_Pending_Outbound", amt);
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('pairingView').classList.remove('hidden');
        
        QRCode.toCanvas(document.getElementById('qrcode'), "TIFFY_TX:" + btoa(JSON.stringify({amount: amt})), {width: 185});
        loadBalances();
    }

    function activateEmbeddedScanner() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('scannerView').classList.remove('hidden');
        
        activeScanner = new Html5Qrcode("camera-viewfinder");
        activeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } }, 
            (decodedText) => {
                if(decodedText.startsWith("TIFFY_TX:")) {
                    stopScannerAndExit();
                    processReceivedTx(decodedText);
                }
            },
            (err) => { console.warn(err); }
        ).catch((err) => {
            alert("Camera initialization failed. Ensure permissions are granted. Error: " + err);
            stopScannerAndExit();
        });
    }

    function stopScannerAndExit() {
        if (activeScanner) {
            activeScanner.stop().then(() => {
                activeScanner.clear();
                exitMode();
            }).catch(() => {
                exitMode();
            });
        } else {
            exitMode();
        }
    }

    function exitMode() {
        document.getElementById('pairingView').classList.add('hidden');
        document.getElementById('scannerView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        loadBalances();
    }

    function cancelPendingTransfer() { localStorage.removeItem("Tiffy_Pending_Outbound"); loadBalances(); }

    function harvestAndRecollectStore() {
        let pin = prompt("Enter Security PIN:");
        if(pin !== GATEWAY_SECURITY_PIN) return;
        let tiffy = 0;
        for(let i=0; i<localStorage.length; i++) {
            const k = localStorage.key(i);
            if((k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) && k !== "TUSD_Nitro_Storage" && k !== "Tiffy_Pending_Outbound") {
                tiffy += parseFloat(localStorage.getItem(k)) || 0;
                localStorage.removeItem(k);
            }
        }
        let nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (nitro + tiffy).toFixed(2));
        loadBalances();
    }

    window.onload = loadBalances;
</script>
</body>
</html>
