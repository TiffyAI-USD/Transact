<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIFFY AI - True P2P Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
  :root {
    --electric-blue: #00f0ff;
    --shocking-pink: #ff007f;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: radial-gradient(circle at 50% 50%, #0d1117 0%, #05070a 100%);
    font-family: 'Orbitron', sans-serif;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; color: #ffffff;
  }

  .terminal-frame {
    background: rgba(10, 15, 24, 0.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 25px 20px; border-radius: 24px;
    width: 90%; max-width: 360px; height: 580px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box;
  }

  body.drag-hover .terminal-frame { border-color: var(--electric-blue); box-shadow: 0 0 30px rgba(0, 240, 255, 0.25); }
  .hidden { display: none !important; }

  .brand-header h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px 0; text-align: center; background: linear-gradient(45deg, var(--electric-blue), var(--shocking-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-header p { color: #8b9bb4; font-size: 10px; margin: 0 0 15px 0; letter-spacing: 2px; text-transform: uppercase; text-align: center; }

  .balance-card { background: rgba(255, 255, 255, 0.01); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; text-align: left; margin-bottom: 12px; }
  .balance-card .meta-label { font-size: 10px; text-transform: uppercase; color: #8b9bb4; margin: 0; }
  .balance-card .main-crypto-val { font-size: 26px; font-weight: 800; margin: 6px 0 2px 0; word-break: break-all; color: #ffffff; }
  
  .token-breakdown { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .token-tile { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 12px; }
  .token-tile h4 { margin: 0 0 4px 0; font-size: 9px; text-transform: uppercase; color: #8b9bb4; }
  .token-tile p { margin: 0; font-size: 14px; font-weight: 700; }

  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 0; color: #ffffff; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.15s ease; }
  .action-panel-btn:active { transform: scale(0.97); }
  .action-panel-btn.pay-btn { border-color: var(--shocking-pink); }
  .action-panel-btn.scan-btn { border-color: #ffffff; grid-column: span 2; background: rgba(255, 255, 255, 0.04); }
  .action-panel-btn.receive-btn { border-color: var(--electric-blue); }

  .pairing-overlay { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; }
  #qrcode { background: #ffffff; padding: 12px; border-radius: 16px; margin: 15px 0; display: flex; align-items: center; justify-content: center; width: 185px; height: 185px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #qrcode img { display: block; width: 185px; height: 185px; border-radius: 8px; object-fit: contain; }
  
  .viewfinder-wrapper { width: 100%; height: 260px; background: #000000; border-radius: 16px; border: 1px solid var(--glass-border); overflow: hidden; margin: 12px 0; position: relative; }
  #camera-viewfinder { width: 100%; height: 100%; }
  #camera-viewfinder video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
  
  .fallback-upload-container { border: 2px dashed rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 40px 20px; text-align: center; background: rgba(255, 255, 255, 0.01); cursor: pointer; width: 100%; box-sizing: border-box; }
  .status-indicator { text-align: center; font-size: 11px; color: #5f7594; margin-top: 5px; }
  .status-indicator span { display: inline-block; width: 6px; height: 6px; background: #00ff66; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #00ff66; }
</style>
</head>
<body>

<div class="terminal-frame">
  <div id="dashboardView" class="dashboard-view">
    <div>
      <div class="brand-header"><h1>TIFFY AI</h1><p>Fluid Ledger Terminal</p></div>
      <div class="balance-card">
        <p class="meta-label">Total Liquid Value</p>
        <div class="main-crypto-val" id="totalBalanceDisplay">$0.00</div>
        <p id="pendingOutboundLabel" style="font-size:9px; color:var(--shocking-pink); margin:4px 0 0 0; display:none;">Pending Outbound: <span id="pendingOutboundValue">0.00</span></p>
      </div>
      <div class="token-breakdown">
        <div class="token-tile" style="border-color: var(--shocking-pink);"><h4 style="color: var(--shocking-pink);">Harvested Utility</h4><p id="tiffyAmount">0.00</p></div>
        <div class="token-tile" style="border-color: var(--electric-blue);"><h4 style="color: var(--electric-blue);">TUSD Nitro</h4><p id="nitroAmount">0.00</p></div>
      </div>
    </div>
    <div>
      <div class="action-grid">
        <button class="action-panel-btn pay-btn" onclick="openTapToPayMode()">Send Code</button>
        <button class="action-panel-btn receive-btn" onclick="harvestAndRecollectStore()">Recollect</button>
        <button id="voidBtn" class="action-panel-btn hidden" style="border-color:var(--shocking-pink); grid-column: span 2;" onclick="cancelPendingTransfer()">VOID PENDING OFFER</button>
        <button class="action-panel-btn scan-btn" onclick="activateEmbeddedScanner()">Scan & Receive</button>
      </div>
      <div class="status-indicator"><span></span><span id="statusMessage">System Active</span></div>
    </div>
  </div>

  <div id="pairingView" class="pairing-overlay hidden">
    <div class="brand-header"><h1>TRANSACTION SIGNATURE</h1><p id="qrSubheading">Awaiting secure claim check...</p></div>
    <div id="qrcode"></div>
    <button class="action-panel-btn" style="width:100%; border-color:#5f7594;" onclick="exitPairingMode()">Close View</button>
  </div>

  <div id="scannerView" class="pairing-overlay hidden">
    <div class="brand-header"><h1>SECURE TERMINAL SCAN</h1></div>
    <div class="viewfinder-wrapper" id="viewfinderWrapper"><div id="camera-viewfinder"></div></div>
    <button class="action-panel-btn" style="width: 100%; border-color: #5f7594;" onclick="stopEmbeddedScanner()">Cancel Interface</button>
  </div>
</div>

<script>
  const TiffyEngine = {
    extractPayloadFromText: function(rawString) {
      if (!rawString || !rawString.includes("TIFFY_TX:")) return null;
      try { return JSON.parse(atob(rawString.split("TIFFY_TX:")[1])); } catch (e) { return null; }
    }
  };

  const GATEWAY_SECURITY_PIN = "1234";

  function loadBalances() {
    let mainNitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || "1450.00");
    let pendingOut = parseFloat(localStorage.getItem("Tiffy_Pending_Outbound") || "0");
    
    document.getElementById('totalBalanceDisplay').innerText = `$${mainNitro.toFixed(2)}`;
    document.getElementById('nitroAmount').innerText = mainNitro.toFixed(2);
    
    if (pendingOut > 0) {
      document.getElementById('pendingOutboundLabel').style.display = "block";
      document.getElementById('pendingOutboundValue').innerText = pendingOut.toFixed(2);
      document.getElementById('voidBtn').classList.remove('hidden');
    } else {
      document.getElementById('pendingOutboundLabel').style.display = "none";
      document.getElementById('voidBtn').classList.add('hidden');
    }
  }

  function openTapToPayMode() {
    if (localStorage.getItem("Tiffy_Pending_Outbound")) { alert("Void existing pending offer first."); return; }
    let amt = prompt("Amount to send:");
    if (!amt || isNaN(amt)) return;
    localStorage.setItem("Tiffy_Pending_Outbound", amt);
    
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('pairingView').classList.remove('hidden');
    
    const txObj = { amount: amt, id: Date.now() };
    const textEnvelope = "TIFFY_TX:" + btoa(JSON.stringify(txObj));
    document.getElementById('qrcode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=185x185&data=${encodeURIComponent(textEnvelope)}" />`;
    loadBalances();
  }

  function cancelPendingTransfer() {
    localStorage.removeItem("Tiffy_Pending_Outbound");
    loadBalances();
    exitPairingMode();
  }

  function activateEmbeddedScanner() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('scannerView').classList.remove('hidden');
    const scanner = new Html5Qrcode("camera-viewfinder");
    scanner.start({ facingMode: "environment" }, { fps: 15 }, (data) => {
      const tx = TiffyEngine.extractPayloadFromText(data);
      if(tx) {
        scanner.stop();
        let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (bal + parseFloat(tx.amount)).toFixed(2));
        alert("Received: " + tx.amount);
        exitPairingMode();
      }
    });
  }

  function exitPairingMode() {
    document.getElementById('pairingView').classList.add('hidden');
    document.getElementById('scannerView').classList.add('hidden');
    document.getElementById('dashboardView').classList.remove('hidden');
    loadBalances();
  }

  function stopEmbeddedScanner() { location.reload(); }
  function harvestAndRecollectStore() { alert("Recollection Module Active."); }
  window.onload = loadBalances;
</script>
</body>
</html>
