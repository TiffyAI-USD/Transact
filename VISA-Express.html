<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - Ultimate Gateway Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root { --electric-blue: #00f0ff; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; background: #05070a; font-family: 'Orbitron', sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .terminal-frame { background: rgba(10, 15, 24, 0.75); border: 1px solid var(--glass-border); padding: 25px; border-radius: 24px; width: 360px; max-height: 90vh; display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }
        .brand-header { font-size: 18px; font-weight: 800; text-align: center; color: var(--electric-blue); margin-bottom: 20px; }
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px; width: 100%; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 10px; }
        .harvest-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .harvest-box { background: rgba(255,255,255,0.02); border: 2px solid var(--glass-border); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
        .harvest-box.active { border-color: var(--electric-blue); background: rgba(0,240,255,0.1); }
        #qrcode { background: #fff; padding: 10px; border-radius: 12px; margin: 20px auto; display: block; width: 200px !important; height: 200px !important; }
        .viewfinder-wrapper { width: 100%; min-height: 260px; background: #000; margin: 12px 0; border: 2px dashed var(--glass-border); }
    </style>
</head>
<body onload="initUI()">

<div class="terminal-frame">
    <div id="authView">
        <div class="brand-header">SECURE ACCESS</div>
        <div class="pin-grid">
            <button class="action-panel-btn" onclick="authenticate()">UNLOCK TERMINAL</button>
        </div>
    </div>

    <div id="dashboardView" class="hidden">
        <div class="brand-header">TIFFY INTERNATIONAL BANK</div>
        <div style="text-align: center; margin: 20px 0;">
            <div id="totalBalanceDisplay" style="font-size:32px; font-weight:800; cursor:pointer;" onclick="cycleCurrency()">$0.00 USD</div>
            
            <div id="escrowContainer" style="display:none; margin:15px 0; border:1px solid var(--electric-blue); padding:10px; border-radius:12px;">
                <p style="font-size:10px; color:var(--electric-blue);">PENDING INBOUND:</p>
                <div id="pendingInboundDisplay" style="font-weight:bold;">$0.00</div>
                <button class="action-panel-btn" onclick="finalizeInbound()">CONFIRM RECEIPT</button>
            </div>

            <div class="harvest-container">
                <div class="harvest-box" id="box-tokens" onclick="setActiveAccount('tokens')">
                    <p style="font-size:8px; color:#888;">TiffyAI tokens</p>
                    <div id="tokenDisplay" style="font-weight:bold;">0.00</div>
                </div>
                <div class="harvest-box" id="box-nitro" onclick="setActiveAccount('nitro')">
                    <p style="font-size:8px; color:#888;">TUSD NITRO</p>
                    <div id="nitroDisplay" style="font-weight:bold;">0.00</div>
                </div>
            </div>
            <button id="collectBtn" class="action-panel-btn hidden" style="background:var(--electric-blue); color:#000;" onclick="collectEarnings()">COLLECT EARNINGS</button>
        </div>
        <button class="action-panel-btn" onclick="openTapToPayMode()">SEND <span id="activeAccountLabel">NITRO</span></button>
        <button class="action-panel-btn" onclick="activateScanner()">RECEIVE ASSET</button>
        <button class="action-panel-btn" style="color:var(--electric-blue);" onclick="window.location.href='https://tiffyai-usd.github.io/Dream-Menu/'">MENU</button>
    </div>

    <div id="pairingView" class="hidden">
        <canvas id="qrcode"></canvas>
        <button class="action-panel-btn" onclick="exitMode()">BACK</button>
    </div>

    <div id="scannerView" class="hidden">
        <div class="viewfinder-wrapper" id="camera-viewfinder"></div>
        <input type="file" id="qr-file-input" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
        <button class="action-panel-btn" onclick="document.getElementById('qr-file-input').click()">UPLOAD QR IMAGE</button>
        <button class="action-panel-btn" onclick="stopScanner()">CANCEL</button>
    </div>
</div>

<script>
    let activeScanner = null, activeAccount = "nitro";
    window.isProcessing = false;
    let currIdx = parseInt(localStorage.getItem("Tiffy_Pref_Currency") || "0");
    const CURRENCIES = [{name: "USD", rate: 1.0}, {name: "ZAR", rate: 19.50}, {name: "EUR", rate: 0.92}];

    function initUI() { setActiveAccount('nitro'); }

    function setActiveAccount(type) {
        activeAccount = type;
        document.getElementById('box-tokens').classList.toggle('active', type === 'tokens');
        document.getElementById('box-nitro').classList.toggle('active', type === 'nitro');
        document.getElementById('activeAccountLabel').innerText = type.toUpperCase();
        document.getElementById('collectBtn').classList.toggle('hidden', type !== 'tokens');
        loadBalances();
    }

    function processQRData(data) {
        if (window.isProcessing || !data.startsWith("TIFFY_TX:")) return;
        window.isProcessing = true;
        
        try {
            const tx = JSON.parse(atob(data.split(":")[1]));
            const processed = JSON.parse(localStorage.getItem("Tiffy_Processed_TXs") || "[]");
            if (processed.includes(tx.txId)) { alert("QR already used"); window.isProcessing = false; return; }

            localStorage.setItem("Tiffy_Pending_Inbound", JSON.stringify(tx));
            alert("Transaction in Escrow. Confirm to finalize.");
            loadBalances();
            stopScanner();
        } catch(e) { window.isProcessing = false; }
    }

    function finalizeInbound() {
        const tx = JSON.parse(localStorage.getItem("Tiffy_Pending_Inbound"));
        const key = tx.asset === 'tokens' ? "tetrusScore" : "TUSD_Nitro_Storage";
        localStorage.setItem(key, (parseFloat(localStorage.getItem(key) || "0") + parseFloat(tx.amount)).toFixed(2));
        
        let processed = JSON.parse(localStorage.getItem("Tiffy_Processed_TXs") || "[]");
        processed.push(tx.txId);
        localStorage.setItem("Tiffy_Processed_TXs", JSON.stringify(processed));
        
        localStorage.removeItem("Tiffy_Pending_Inbound");
        loadBalances();
    }

    async function handleFileUpload(e) {
        const file = e.target.files[0];
        if(!file) return;
        const scanner = new Html5Qrcode("camera-viewfinder");
        try {
            const data = await scanner.scanFile(file, true);
            processQRData(data);
        } finally { e.target.value = ''; scanner.clear(); }
    }

    function stopScanner() { 
        if(activeScanner) { activeScanner.stop().then(exitMode).catch(exitMode); } 
        else { exitMode(); }
    }

    function exitMode() {
        window.isProcessing = false;
        document.getElementById('pairingView').classList.add('hidden');
        document.getElementById('scannerView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
        loadBalances();
    }

    function loadBalances() {
        let tokens = parseFloat(localStorage.getItem("tetrusScore") || "0.00");
        let nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || "0.00");
        let pending = JSON.parse(localStorage.getItem("Tiffy_Pending_Inbound") || "null");
        
        document.getElementById('tokenDisplay').innerText = tokens.toFixed(2);
        document.getElementById('nitroDisplay').innerText = nitro.toFixed(2);
        
        const escUI = document.getElementById('escrowContainer');
        if(pending) {
            escUI.style.display = "block";
            document.getElementById('pendingInboundDisplay').innerText = "$" + pending.amount;
        } else { escUI.style.display = "none"; }

        let activeVal = (activeAccount === 'tokens' ? tokens : nitro);
        document.getElementById('totalBalanceDisplay').innerText = (activeVal * CURRENCIES[currIdx].rate).toFixed(2) + " " + CURRENCIES[currIdx].name;
    }
    
    // Auth, CycleCurrency, etc... same logic as before.
</script>
</body>
</html>
