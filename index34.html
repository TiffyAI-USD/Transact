<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - SECURE TWO-WAY HANDSHAKE</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; background: #05070a; font-family: 'Orbitron', sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .terminal-frame { background: rgba(10, 15, 24, 0.75); border: 1px solid var(--glass-border); padding: 25px; border-radius: 24px; width: 360px; min-height: 500px; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        .brand-header { font-size: 18px; font-weight: 800; text-align: center; color: var(--electric-blue); margin-bottom: 20px; }
        .action-panel-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px; width: 100%; color: #fff; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 10px; }
        #qrcode { background: #fff; padding: 10px; border-radius: 12px; margin: 20px auto; display: block; width: 200px !important; height: 200px !important; }
        .viewfinder-wrapper { width: 100%; height: 260px; background: #000; margin: 12px 0; border: 2px dashed var(--glass-border); }
    </style>
</head>
<body>

<div class="terminal-frame">
    <div id="dashboardView">
        <div class="brand-header">TIFFY AI NODE</div>
        <div style="text-align: center; margin: 20px 0;">
            <div id="totalBalanceDisplay" style="font-size:32px; font-weight:800;">$0.00</div>
            <p id="pendingOutboundLabel" style="color:var(--shocking-pink); display:none; font-size:10px;">ESCROW: $<span id="pendingOutboundValue">0.00</span></p>
        </div>
        <button class="action-panel-btn" onclick="openTapToPayMode()">SEND ASSET</button>
        <button class="action-panel-btn" onclick="activateEmbeddedScanner()">SCAN & RECEIVE / ACK</button>
        <button id="voidBtn" class="action-panel-btn hidden" style="border-color:var(--shocking-pink);" onclick="cancelPendingTransfer()">VOID ESCROW</button>
    </div>

    <div id="pairingView" class="hidden">
        <h2 style="text-align:center; font-size:14px;">SCAN TO PROCEED</h2>
        <canvas id="qrcode"></canvas>
        <button class="action-panel-btn" onclick="exitMode()">CLOSE</button>
    </div>

    <div id="scannerView" class="hidden">
        <div class="viewfinder-wrapper" id="camera-viewfinder"></div>
        <button class="action-panel-btn" onclick="stopScannerAndExit()">CANCEL</button>
    </div>
</div>

<script>
    let activeScanner = null;

    function loadBalances() {
        const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        const pend = parseFloat(localStorage.getItem("Tiffy_Pending_Outbound") || 0);
        document.getElementById('totalBalanceDisplay').innerText = "$" + nitro.toFixed(2);
        
        const pendUI = document.getElementById('pendingOutboundLabel');
        const vBtn = document.getElementById('voidBtn');
        if(pend > 0) {
            pendUI.style.display = "block";
            document.getElementById('pendingOutboundValue').innerText = pend.toFixed(2);
            vBtn.classList.remove('hidden');
        } else {
            pendUI.style.display = "none";
            vBtn.classList.add('hidden');
        }
    }

    function showQRCode(payload) {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('pairingView').classList.remove('hidden');
        // Timeout ensures the canvas has DOM width/height before render
        setTimeout(() => {
            QRCode.toCanvas(document.getElementById('qrcode'), payload, {width: 200});
        }, 100);
    }

    function openTapToPayMode() {
        if(localStorage.getItem("Tiffy_Pending_Outbound")) { alert("Escrow active."); return; }
        let amt = prompt("Amount:");
        if(!amt || isNaN(amt)) return;
        
        let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (bal - parseFloat(amt)).toFixed(2));
        
        const txId = Date.now().toString();
        localStorage.setItem("Tiffy_Pending_Outbound", amt);
        localStorage.setItem("Tiffy_Pending_TxId", txId);
        
        showQRCode("TIFFY_TX:" + btoa(JSON.stringify({amount: amt, id: txId})));
        loadBalances();
    }

    function activateEmbeddedScanner() {
        document.getElementById('dashboardView').classList.add('hidden');
        document.getElementById('scannerView').classList.remove('hidden');
        activeScanner = new Html5Qrcode("camera-viewfinder");
        activeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (data) => {
            stopScannerAndExit();
            
            // ACKNOWLEDGEMENT LOGIC: Clear escrow if this is our TX ID
            if(data.startsWith("TIFFY_ACK:")) {
                const ackId = data.split(":")[1];
                if(ackId === localStorage.getItem("Tiffy_Pending_TxId")) {
                    localStorage.removeItem("Tiffy_Pending_Outbound");
                    localStorage.removeItem("Tiffy_Pending_TxId");
                    alert("Transfer Confirmed. Escrow Cleared.");
                    loadBalances();
                }
            } 
            // INCOMING TX LOGIC: Confirm and send ACK
            else if(data.startsWith("TIFFY_TX:")) {
                const tx = JSON.parse(atob(data.split(":")[1]));
                if(confirm("Accept incoming $" + tx.amount + "?")) {
                    let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
                    localStorage.setItem("TUSD_Nitro_Storage", (bal + parseFloat(tx.amount)).toFixed(2));
                    // Send ACK code back to original sender
                    showQRCode("TIFFY_ACK:" + tx.id);
                }
            }
        });
    }

    function stopScannerAndExit() { if (activeScanner) activeScanner.stop().then(exitMode).catch(exitMode); else exitMode(); }
    function exitMode() { document.getElementById('pairingView').classList.add('hidden'); document.getElementById('scannerView').classList.add('hidden'); document.getElementById('dashboardView').classList.remove('hidden'); loadBalances(); }
    function cancelPendingTransfer() { 
        let pend = parseFloat(localStorage.getItem("Tiffy_Pending_Outbound") || 0);
        let bal = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 0);
        localStorage.setItem("TUSD_Nitro_Storage", (bal + pend).toFixed(2));
        localStorage.removeItem("Tiffy_Pending_Outbound");
        localStorage.removeItem("Tiffy_Pending_TxId");
        loadBalances();
    }
    window.onload = loadBalances;
</script>
</body>
</html>
