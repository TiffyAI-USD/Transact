<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFFY AI - Ultimate Gateway Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        :root { --electric-blue: #00f0ff; --shocking-pink: #ff007f; }
        body { margin: 0; background: #05070a; font-family: 'Orbitron', sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* Full Frame */
        .terminal-frame { background: rgba(10, 15, 24, 0.9); border: 1px solid #222; padding: 25px; border-radius: 24px; width: 360px; height: 580px; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        .hidden { display: none !important; }
        
        /* UI Components */
        .brand-header { font-size: 18px; font-weight: 800; text-align: center; color: var(--electric-blue); margin-bottom: 20px; }
        .action-panel-btn { background: #0d1117; border: 1px solid var(--shocking-pink); color: #fff; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; text-transform: uppercase; font-size: 11px; margin-top: 10px; }
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .glass-btn { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 15px 0; border-radius: 12px; cursor: pointer; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #222; margin: 0 6px; }
        .dot.active { background: var(--electric-blue); box-shadow: 0 0 10px var(--electric-blue); }
    </style>
</head>
<body>

<audio id="snd-auth" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<div class="terminal-frame">
    <div id="authView">
        <div class="brand-header">TIFFY GATEWAY</div>
        <div style="display:flex; justify-content:center; margin: 20px 0;">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pin-grid">
            <button class="glass-btn" onclick="inputPin(1)">1</button><button class="glass-btn" onclick="inputPin(2)">2</button><button class="glass-btn" onclick="inputPin(3)">3</button>
            <button class="glass-btn" onclick="inputPin(4)">4</button><button class="glass-btn" onclick="inputPin(5)">5</button><button class="glass-btn" onclick="inputPin(6)">6</button>
            <button class="glass-btn" onclick="inputPin(7)">7</button><button class="glass-btn" onclick="inputPin(8)">8</button><button class="glass-btn" onclick="inputPin(9)">9</button>
            <button class="glass-btn" onclick="clearPin()">C</button><button class="glass-btn" onclick="inputPin(0)">0</button>
            <button class="glass-btn" style="border-color:var(--electric-blue)" onclick="authenticate()">OK</button>
        </div>
    </div>

    <div id="dashboardView" class="hidden">
        <div class="brand-header">TERMINAL ACTIVE</div>
        <div id="totalBalanceDisplay" style="text-align:center; font-size:36px; margin:30px 0;">$0.00</div>
        <button class="action-panel-btn" onclick="collectEarnings()">COLLECT UTILITY</button>
        <button class="action-panel-btn" onclick="activateScanner()">SYNC ASSET</button>
    </div>
</div>

<script>
    let currentPin = "";
    
    function inputPin(n) { if(currentPin.length < 4) { currentPin += n; updateDots(); } }
    function clearPin() { currentPin = ""; updateDots(); }
    
    function updateDots() { 
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i < currentPin.length)); 
    }

    function authenticate() {
        const savedPin = localStorage.getItem("Tiffy_User_PIN") || "1234";
        if(currentPin === savedPin) {
            // Trigger Audio & Transition
            document.getElementById('snd-auth').play();
            document.getElementById('authView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadBalances();
        } else {
            alert("Auth Failed");
            clearPin();
        }
    }

    function loadBalances() {
        // Logic to read from Tetrus/Tiffy keys
        let total = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) total += parseFloat(localStorage.getItem(k)) || 0;
        }
        const nitro = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 500.00);
        document.getElementById('totalBalanceDisplay').innerText = "$" + (total + nitro).toFixed(2);
    }

    function collectEarnings() {
        // Logic to clear and move tokens
        let tokens = 0;
        for(let i=0; i<localStorage.length; i++) {
            let k = localStorage.key(i);
            if(k.toLowerCase().includes('tetrus') || k.toLowerCase().includes('tiffy')) {
                tokens += parseFloat(localStorage.getItem(k)) || 0;
                localStorage.removeItem(k);
            }
        }
        let b = parseFloat(localStorage.getItem("TUSD_Nitro_Storage") || 500.00);
        localStorage.setItem("TUSD_Nitro_Storage", (b + (tokens * 20)).toFixed(2));
        loadBalances();
    }
</script>
</body>
</html>
